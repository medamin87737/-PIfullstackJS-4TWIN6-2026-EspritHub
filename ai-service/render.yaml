services:
  - type: web
    name: hr-ai-service
    env: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port 10000 --workers 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL_DIR
        value: /tmp/models
      - key: AI_FEEDBACK_FILE
        value: /tmp/feedback_events.jsonl
      - key: PYTHONUNBUFFERED
        value: "1"
