sonar.projectKey=skillup-frontend
sonar.projectName=SkillUp Frontend
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Aligné avec Vitest : ne pas exiger une couverture ligne-par-ligne sur chaque écran (smoke dédiés).
sonar.coverage.exclusions=**/pages/**,**/components/layout/**
