# PrometheusRule — skillup namespace (requires kube-prometheus-stack + kube-state-metrics).
# Label release must match Helm release name (install scripts use "kube-prom").
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: skillup-app-health
  namespace: monitoring
  labels:
    release: kube-prom
    app: kube-prometheus-stack
spec:
  groups:
    - name: skillup.deployments
      rules:
        - alert: SkillUpBackendReplicasUnavailable
          expr: |
            kube_deployment_spec_replicas{namespace="skillup",deployment="backend"}
            - kube_deployment_status_replicas_available{namespace="skillup",deployment="backend"}
            > 0
          for: 2m
          labels:
            severity: warning
            team: skillup
          annotations:
            summary: Backend SkillUp — replicas non disponibles
            description: Le deployment backend dans skillup n’a pas tous ses pods Ready.

        - alert: SkillUpFrontendReplicasUnavailable
          expr: |
            kube_deployment_spec_replicas{namespace="skillup",deployment="frontend"}
            - kube_deployment_status_replicas_available{namespace="skillup",deployment="frontend"}
            > 0
          for: 2m
          labels:
            severity: warning
            team: skillup
          annotations:
            summary: Frontend SkillUp — replicas non disponibles
            description: Le deployment frontend dans skillup n’a pas tous ses pods Ready.

        - alert: SkillUpMongoReplicasUnavailable
          expr: |
            kube_deployment_spec_replicas{namespace="skillup",deployment="mongo"}
            - kube_deployment_status_replicas_available{namespace="skillup",deployment="mongo"}
            > 0
          for: 2m
          labels:
            severity: critical
            team: skillup
          annotations:
            summary: Mongo SkillUp — replicas non disponibles
            description: Le deployment mongo dans skillup n’a pas tous ses pods Ready.
