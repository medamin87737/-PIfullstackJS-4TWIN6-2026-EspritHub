# kube-prometheus-stack — SkillUp (Grafana + Prometheus + Alertmanager + exporters)
# Release name must stay "kube-prom" so PrometheusRule labels match.
#
# helm upgrade --install kube-prom prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f k8s/monitoring/helm-values-skillup.yaml
#
# URLs (NodePort) : Grafana :30300  Prometheus :30301
# Forward VMware / routeur → VM (or single-node) comme pour 30080/30081.

# Sur une VM 2 vCPU / 4 GiB, préférez ne pas installer cette stack (voir scripts/fit-small-node-2c4g.sh).
grafana:
  enabled: true
  service:
    type: NodePort
    nodePort: 30300
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi

prometheus:
  enabled: true
  service:
    type: NodePort
    nodePort: 30301
  prometheusSpec:
    retention: 7d
    scrapeInterval: 60s
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: 400m
        memory: 1Gi
    # Scrape kube-state-metrics + node-exporter (chart defaults)

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 96Mi

defaultRules:
  create: true

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
