# kube-prometheus-stack — SkillUp (Grafana + Prometheus + Alertmanager + exporters)
# Release name must stay "kube-prom" so PrometheusRule labels match.
#
# helm upgrade --install kube-prom prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f k8s/monitoring/helm-values-skillup.yaml
#
# URLs (NodePort) : Grafana :30300  Prometheus :30301
# Forward VMware / routeur → VM (or single-node) comme pour 30080/30081.

grafana:
  enabled: true
  service:
    type: NodePort
    nodePort: 30300
  # Lighter default for pet clusters
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

prometheus:
  enabled: true
  service:
    type: NodePort
    nodePort: 30301
  prometheusSpec:
    retention: 15d
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        cpu: "1"
        memory: 2Gi
    # Scrape kube-state-metrics + node-exporter (chart defaults)

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

defaultRules:
  create: true

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
