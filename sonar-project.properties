sonar.projectKey=skillup-tn-fullstack
sonar.projectName=SkillUpTnFrontBack
sonar.sourceEncoding=UTF-8

# Analyse des deux applications
sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,frontend/src

# Reconnaissance des fichiers de tests
sonar.test.inclusions=backend/src/**/*.spec.ts,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# Exclusions habituelles
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts

# Alignement avec Jest collectCoverageFrom : bootstrap Nest, scripts, DTOs décorateurs,
# et services monolithiques non mesurés en unitaire (ciblés plutôt par tests d’intégration).
sonar.coverage.exclusions=**/main.ts,**/*.module.ts,**/scripts/**,**/dto/**,**/types/**,**/recommendations/_patch_export.*,**/recommendation.service.ts,**/chat.service.ts,**/users.service.ts,**/pptx.service.ts,**/certificate.service.ts,**/manager.service.ts,**/mail.service.ts,**/*.controller.ts,**/notification.gateway.ts,**/chat/interfaces/**,**/manager/**,**/recommendations/recommendation.controller.ts,frontend/src/pages/**,frontend/src/components/layout/**

# Seuil 70 % : configurer une Quality Gate SonarQube (Coverage on New Code / Overall Coverage).

# Couverture générée par les pipelines CI
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
